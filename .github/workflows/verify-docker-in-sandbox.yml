name: Verify Docker in Sandbox Image

on:
  workflow_dispatch:
    inputs:
      image:
        description: Immutable sandbox0ai/otemplates image digest
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - name: Validate immutable image
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          [[ "$IMAGE" =~ ^(docker.io/)?sandbox0ai/otemplates@sha256:[a-f0-9]{64}$ ]]
      - uses: docker/setup-buildx-action@v3
      - name: Verify Docker in stock gVisor
        env:
          IMAGE: ${{ inputs.image }}
        run: bash tools/docker-in-sandbox/ci-smoke.sh "$IMAGE"
