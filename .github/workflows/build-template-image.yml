name: Build Template Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Template image tag (e.g. default-v0.2.0)"
        required: true
        default: "default-v0.2.0"
      dockerfile:
        description: "Dockerfile path relative to repo root"
        required: true
        default: "manager/procd/Dockerfile.default"
      publish_receipt:
        description: Publish a verified default-auto release for infrastructure promotion
        type: boolean
        default: false
      base_image:
        description: "Immutable sandbox0ai/otemplates base (required for Dockerfile.dind)"
        required: false
        default: ""
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      dockerfile:
        required: false
        type: string
        default: manager/procd/Dockerfile.default
      base_image:
        required: false
        type: string
        default: ""
      publish_receipt:
        required: false
        type: boolean
        default: false

env:
  IMAGE_REPO: sandbox0ai/otemplates

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Validate automatic release intent
        if: inputs.publish_receipt
        env:
          VERSION: ${{ inputs.version }}
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          [[ "$VERSION" =~ ^default-auto-[0-9]+-[0-9]+$ ]]
          [[ "$DOCKERFILE" == manager/procd/Dockerfile.default ]]

      - name: Validate Docker compatibility image base
        if: inputs.dockerfile == 'manager/procd/Dockerfile.dind'
        env:
          BASE_IMAGE: ${{ inputs.base_image }}
        run: |
          [[ "$BASE_IMAGE" =~ ^(docker.io/)?sandbox0ai/otemplates@sha256:[a-f0-9]{64}$ ]]

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push template image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          build-args: |
            BASE_IMAGE=${{ inputs.base_image }}
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.IMAGE_REPO }}:${{ inputs.version }}-${{ matrix.arch }}
          provenance: false
          pull: true
          no-cache: ${{ inputs.publish_receipt }}

      - name: Verify Docker in stock gVisor
        if: inputs.dockerfile == 'manager/procd/Dockerfile.default' || inputs.dockerfile == 'manager/procd/Dockerfile.coding-agent' || inputs.dockerfile == 'manager/procd/Dockerfile.dind'
        timeout-minutes: 15
        env:
          IMAGE: ${{ env.IMAGE_REPO }}:${{ inputs.version }}-${{ matrix.arch }}
        run: bash tools/docker-in-sandbox/ci-smoke.sh "$IMAGE"

  manifest:
    name: Create multi-arch manifest
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          docker buildx imagetools create -t $IMAGE_REPO:${{ inputs.version }} \
            $IMAGE_REPO:${{ inputs.version }}-amd64 \
            $IMAGE_REPO:${{ inputs.version }}-arm64

      - name: Print published image
        run: |
          echo "Published multi-arch image: ${IMAGE_REPO}:${{ inputs.version }}"
          echo "Dockerfile: ${{ inputs.dockerfile }}"
          echo "Platforms: linux/amd64, linux/arm64"

      - name: Publish verified default template release
        if: inputs.publish_receipt
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source="${IMAGE_REPO}:${VERSION}"
          manifest="$(docker buildx imagetools inspect "$source" --format '{{json .Manifest}}')"
          digest="$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' <<< "$manifest")"
          jq -n --arg version "$VERSION" --arg source "$source" \
            --arg image "${IMAGE_REPO}@${digest}" --arg commit "$SOURCE_COMMIT" \
            '{version: $version, source: $source, image: $image, commit: $commit, dockerInDocker: 1}' > default-release.json
          gh release create "$VERSION" default-release.json --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_COMMIT" --title "$VERSION" --latest=false \
            --notes 'Automated default template refresh. Both native architectures passed Docker smoke checks in stock gVisor.'
          cat default-release.json >> "$GITHUB_STEP_SUMMARY"
