name: Release Package

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "**/*.mdx"
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        required: false
        type: string
      publish_images:
        required: false
        type: boolean
        default: false
      publish_latest:
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        required: false
        type: string
      publish_images:
        required: false
        type: boolean
        default: false
      publish_latest:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE_REPO: sandbox0ai/infra

jobs:
  metadata:
    name: release-package / metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      publish_images: ${{ steps.meta.outputs.publish_images }}
      publish_latest: ${{ steps.meta.outputs.publish_latest }}
    steps:
      - name: Derive release metadata
        id: meta
        shell: bash
        run: |
          requested_version="${{ inputs.version }}"
          publish_images="false"
          publish_latest="false"

          if [[ "${{ inputs.publish_images }}" == "true" ]]; then
            publish_images="true"
          fi
          if [[ "${{ inputs.publish_latest }}" == "true" ]]; then
            publish_latest="true"
          fi

          if [[ -n "${requested_version}" ]]; then
            version="${requested_version}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "publish_images=${publish_images}" >> "$GITHUB_OUTPUT"
          echo "publish_latest=${publish_latest}" >> "$GITHUB_OUTPUT"

  infra:
    name: release-package / infra
    runs-on: ubuntu-latest
    needs: metadata
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Free runner space
        uses: ./.github/actions/free-runner-space

      - name: Restore infra build cache
        uses: ./.github/actions/restore-infra-build-cache
        with:
          cache-key-suffix: release-package-amd64

      - name: Build local binaries
        run: make build-local-all

      - name: Build unified infra image from local binaries
        env:
          TAG: release-package
        run: docker build -t "${IMAGE_REPO}:${TAG}" -f Dockerfile.local .

  publish-images:
    name: release-package / publish images
    if: ${{ needs.metadata.outputs.publish_images == 'true' }}
    needs:
      - metadata
      - infra
    uses: ./.github/workflows/publish-infra-images.yml
    with:
      version: ${{ needs.metadata.outputs.version }}
      publish_latest: ${{ needs.metadata.outputs.publish_latest == 'true' }}
    secrets: inherit
