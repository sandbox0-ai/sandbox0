name: Release

on:
  push:
    tags:
      - 'v*'

env:
  IMAGE_REPO: sandbox0ai/infra

permissions:
  actions: read
  contents: write
  packages: write
  id-token: write

jobs:
  prepare-release:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      is_prerelease: ${{ steps.version.outputs.IS_PRERELEASE }}
    steps:
      - name: Extract and validate version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must be in the form vMAJOR.MINOR.PATCH[-PRERELEASE], got: ${GITHUB_REF_NAME}"
            exit 1
          fi

          if [[ "$VERSION" == *-* ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_OUTPUT"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_OUTPUT"
          fi

  package:
    name: Package release assets
    needs: prepare-release
    uses: ./.github/workflows/release-package.yml
    with:
      version: ${{ needs.prepare-release.outputs.version }}

  publish-images:
    name: Publish infra images
    needs:
      - prepare-release
      - package
    uses: ./.github/workflows/publish-infra-images.yml
    with:
      version: ${{ needs.prepare-release.outputs.version }}
      publish_latest: ${{ needs.prepare-release.outputs.is_prerelease != 'true' }}
    secrets: inherit

  create-draft-release:
    name: Create or update draft GitHub Release
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - package
    steps:
      - name: Create or update draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          NOTES=$(cat <<EOF
          Automated release for ${TAG}.

          Published artifacts:
          - Docker image: docker.io/${IMAGE_REPO}:${{ needs.prepare-release.outputs.version }}
          EOF
          )

          if gh release view "${TAG}" >/dev/null 2>&1; then
            IS_DRAFT=$(gh release view "${TAG}" --json isDraft --jq '.isDraft')
            IS_IMMUTABLE=$(gh release view "${TAG}" --json isImmutable --jq '.isImmutable')
            if [[ "${IS_IMMUTABLE}" == "true" ]]; then
              echo "Release ${TAG} already exists and is immutable. Delete the release before rerunning this workflow for the same tag."
              exit 1
            fi

            if [[ "${IS_DRAFT}" != "true" ]]; then
              echo "Release ${TAG} already exists and is published. This workflow requires a draft release."
              exit 1
            fi

            gh release edit "${TAG}" --title "${TAG}" --notes "${NOTES}"
          else
            args=(--draft --title "${TAG}" --notes "${NOTES}")
            if [[ "${{ needs.prepare-release.outputs.is_prerelease }}" == "true" ]]; then
              args+=(--prerelease)
            fi
            gh release create "${TAG}" "${args[@]}"
          fi

  publish-release-record:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - package
      - create-draft-release
      - publish-images
    steps:
      - name: Publish draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} does not exist."
            exit 1
          fi

          IS_DRAFT=$(gh release view "${TAG}" --json isDraft --jq '.isDraft')
          IS_IMMUTABLE=$(gh release view "${TAG}" --json isImmutable --jq '.isImmutable')

          if [[ "${IS_DRAFT}" != "true" ]]; then
            if [[ "${IS_IMMUTABLE}" == "true" ]]; then
              echo "Release ${TAG} is already published and immutable."
            else
              echo "Release ${TAG} is already published."
            fi
            exit 1
          fi

          gh release edit "${TAG}" --draft=false
