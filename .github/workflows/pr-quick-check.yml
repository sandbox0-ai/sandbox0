name: PR Quick Check

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "**/*.mdx"

concurrency:
  group: pr-quick-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quick-check:
    name: quick-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test coding-agent dependency updater
        run: node --test manager/procd/coding-agents/update.test.mjs

      - name: Restore infra build cache
        uses: ./.github/actions/restore-infra-build-cache
        with:
          cache-key-suffix: pr-amd64

      - name: Install golangci-lint
        shell: bash
        run: |
          export PATH="${RUNNER_TEMP}/bin:${PATH}"
          GOBIN="${RUNNER_TEMP}/bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.5.0
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
          golangci-lint version

      - name: Verify Go formatting
        shell: bash
        run: |
          files="$(git ls-files '*.go')"
          if [ -z "$files" ]; then
            exit 0
          fi
          gofmt_bin="$(go env GOROOT)/bin/gofmt"
          go version -m "$gofmt_bin"
          unformatted="$("$gofmt_bin" -l $files)"
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            "$gofmt_bin" -d $files
            exit 1
          fi

      - name: Verify generated artifacts are up to date
        shell: bash
        run: |
          make apispec
          git diff --exit-code

      - name: Verify go.mod/go.sum are tidy
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Run golangci-lint
        run: GOFLAGS=-buildvcs=false golangci-lint run ./...

      - name: Run unit tests
        shell: bash
        run: |
          packages="$(go list -buildvcs=false ./... | grep -Ev '/tests/(e2e|integration)(/|$)')"
          GOTOOLCHAIN=go1.25.0+auto go test -buildvcs=false -race -count=1 $packages

      - name: Verify ctld carries and installs procd without a sidecar file
        shell: bash
        run: |
          sh scripts/build-ctld.sh "${RUNNER_TEMP}/ctld"
          digest="$("${RUNNER_TEMP}/ctld" --procd-digest)"
          installed="$(sudo "${RUNNER_TEMP}/ctld" --install-procd --expected-procd-digest "${digest}")"
          test "sha256:$(sha256sum "${installed}" | cut -d' ' -f1)" = "${digest}"
          test "$(stat -c %a "${installed}")" = 555

      - name: Enforce 100% billing admission statement coverage
        shell: bash
        run: |
          profile="$(mktemp)"
          trap 'rm -f -- "$profile"' EXIT
          GOTOOLCHAIN=go1.25.0+auto go test -buildvcs=false -count=1 -coverprofile="$profile" ./pkg/gateway/admission
          coverage="$(go tool cover -func="$profile" | awk '/^total:/ { print $3 }')"
          test "$coverage" = "100.0%"

      - name: Show git diff on failure
        if: failure()
        shell: bash
        run: |
          git status --short
          git diff --stat
